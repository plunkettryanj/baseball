name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [development, main]

jobs:
  test:
    runs-on: ubuntu-24.04

    services:
      clickhouse:
        image: clickhouse/clickhouse-server:latest   # pin to the same version as your docker-compose.yml
        env:
          CLICKHOUSE_USER: ci_admin
          CLICKHOUSE_PASSWORD: ci_password
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        ports:
          - 8123:8123
          - 9000:9000
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v5

      - name: Install SOPS
        run: |
          curl -fsSL -o sops \
            https://github.com/getsops/sops/releases/download/v3.10.2/sops-v3.10.2.linux.amd64
          chmod +x sops
          sudo mv sops /usr/local/bin/sops
          sops --version

      - name: Decrypt secrets
        env:
          SOPS_AGE_KEY: ${{ secrets.AGE_KEY }}
        run: |
          sops -d --output secrets.yaml secrets.enc.yaml
          test -s secrets.yaml
          grep -q '^clickhouse:' secrets.yaml && echo "secrets.yaml decrypted OK"

      - name: Debug file paths
        run: |
          pwd
          ls -la docker/clickhouse ddl || true
          git ls-files | grep -i '\.sql$'

      - name: Create databases and raw table
        run: |
          CH="http://localhost:8123/?user=ci_admin&password=ci_password"
          for db in raw staging analytics; do
            curl -sf "$CH" --data-binary "CREATE DATABASE IF NOT EXISTS $db"
          done
          curl -sf "$CH" --data-binary @ddl/ddl_raw_statcast_pitches.sql
          
      - name: Create app user from secrets
        run: |
          CH_USER=$(python3 -c "import yaml;print(yaml.safe_load(open('secrets.yaml'))['clickhouse']['user'])")
          CH_PASS=$(python3 -c "import yaml;print(yaml.safe_load(open('secrets.yaml'))['clickhouse']['password'])")
          echo "::add-mask::$CH_PASS"
          CH="http://localhost:8123/?user=ci_admin&password=ci_password"
          curl -sf "$CH" --data-binary "CREATE USER IF NOT EXISTS ${CH_USER} IDENTIFIED BY '${CH_PASS}'"
          curl -sf "$CH" --data-binary "GRANT ALL ON raw.* TO ${CH_USER}"
          curl -sf "$CH" --data-binary "GRANT ALL ON staging.* TO ${CH_USER}"
          curl -sf "$CH" --data-binary "GRANT ALL ON analytics.* TO ${CH_USER}"
    
      - name: Verify bootstrap
        run: |
          CH="http://localhost:8123/?user=ci_admin&password=ci_password"
          curl -sf "$CH" --data-binary "SHOW DATABASES"
          curl -sf "$CH" --data-binary "SHOW TABLES FROM raw"

      - name: Smoke test ClickHouse
        run: |
          curl -sf "http://localhost:8123/?user=ci_admin&password=ci_password" \
            --data-binary "SELECT version()"