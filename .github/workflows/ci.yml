name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [development, main]

jobs:
  test:
    runs-on: ubuntu-24.04

    services:
      clickhouse:
        image: clickhouse/clickhouse-server:latest   # pin to the same version as your docker-compose.yml
        env:
          CLICKHOUSE_USER: ci_admin
          CLICKHOUSE_PASSWORD: ci_password
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        ports:
          - 8123:8123
          - 9000:9000
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v5

      - name: Install SOPS
        run: |
          curl -fsSL -o sops \
            https://github.com/getsops/sops/releases/download/v3.10.2/sops-v3.10.2.linux.amd64
          chmod +x sops
          sudo mv sops /usr/local/bin/sops
          sops --version

      - name: Decrypt secrets
        env:
          SOPS_AGE_KEY: ${{ secrets.AGE_KEY }}
        run: |
          sops -d --output secrets.yaml secrets.enc.yaml
          test -s secrets.yaml
          grep -q '^clickhouse:' secrets.yaml && echo "secrets.yaml decrypted OK"
          
      - name: Smoke test ClickHouse
        run: |
          curl -sf "http://localhost:8123/?user=ci_admin&password=ci_password" \
            --data-binary "SELECT version()"